[package]
name = "lsda"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read and write the language-specific data area of GCC-compatible exception handling (.gcc_except_table)."
repository = "https://github.com/Fee0/lsda"
license = "MIT"
keywords = ["lsda", "exception", "gcc_except_table", "unwind", "elf"]
categories = ["development-tools::debugging", "parser-implementations", "no-std"]
readme = "README.md"
include = [
    "/src",
    "/examples",
    "/tests/elf/mod.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["read", "write"]
# Reading `.gcc_except_table`.
read = []
# Writing `.gcc_except_table`.
write = []
# Implement `fallible_iterator::FallibleIterator` for the iterators.
fallible-iterator = ["dep:fallible-iterator"]

[dependencies]
fallible-iterator = { version = "0.3.0", default-features = false, optional = true }

[dev-dependencies]
ehabi = "0.2"
gimli = { version = "0.31", default-features = false, features = ["read", "std"] }
object = { version = "0.36", default-features = false, features = ["read", "std"] }

[[example]]
name = "lsdadump"
required-features = ["read"]

[[test]]
name = "elf_files"
required-features = ["read", "write"]

[[test]]
name = "fuzz"
required-features = ["read", "write"]

[[test]]
name = "oracle"
required-features = ["read", "write"]

[[test]]
name = "corpus"
required-features = ["read", "write"]

[[test]]
name = "ehabi"
required-features = ["read", "write"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Encoded pointers are truncated to their field size; every value is
# range-checked or masked before it is cast.
cast_possible_truncation = "allow"
# The `DW_EH_PE_*` constants are used in bulk in encoding matches.
wildcard_imports = "allow"
